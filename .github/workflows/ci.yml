name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Reject unauthenticated endpoints and servers
        run: uv run python tools/check_endpoint_auth.py
      - name: Test
        run: uv run pytest
