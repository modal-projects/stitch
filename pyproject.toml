[project]
name = "stitch"
version = "0.1.0"
description = "Autoscaled inference engines on Modal that follow a trainer's weights through lossless deltas"
requires-python = ">=3.11"
dependencies = [
    "autoinference-utils==0.3.0",
    "modal>=1.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stitch"]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP037"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
