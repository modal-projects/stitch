[project]
name = "stitch"
version = "0.1.0"
description = "Versioned control plane for disaggregated RL rollouts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# httpx is the pool wake (pools/modal_flash.py).
modal = ["modal>=1.5.4.dev11", "httpx"]
s3 = ["boto3"]
# fastapi + httpx only; Modal images install uvicorn separately.
sglang = ["fastapi", "httpx"]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.15.1",
    "modal>=1.5.4.dev11",
    "fastapi",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitch"]
exclude = ["*_test.py"]

[tool.pytest.ini_options]
testpaths = ["src", "cookbook"]  # google-style: foo_test.py sits beside foo.py
python_files = ["*_test.py"]
pythonpath = ["."]  # so the co-located cookbook hook test imports the top-level cookbook/ package

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP037"]
